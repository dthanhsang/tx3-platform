# TX3 Bootstrap Configuration
# This file is injected into ROM during build
# Contains provisioning server info for first-boot registration

PROVISION_SERVER=http://your-server.example.com:8400
BOOTSTRAP_TOKEN=CHANGE-ME-use-provisioning-token-from-server

# Agent settings
AGENT_AUTO_START=1
WIREGUARD_AUTO_START=1
ADB_AUTO_ENABLE=1
ADB_TCP_PORT=5555

# Stream defaults (S905W/2GB optimized)
STREAM_DEFAULT_PROFILE=auto
STREAM_MAX_FPS=25
STREAM_MAX_BITRATE=2500

# Resource guard
RESOURCE_GUARD_ENABLED=1
SOFT_RAM_PERCENT=80
HARD_RAM_PERCENT=90
SOFT_TEMP_C=75
HARD_TEMP_C=85
